button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);cursor:pointer;}

<script>
(function(){
  var D = JSON.parse(document.getElementById('dane').textContent);
  var KLUCZ_SESJI = 'doc-haslo';
  function bajty(b64){ var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function odszyfruj(haslo){
    var baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(haslo), 'PBKDF2', false, ['deriveKey']);
    var klucz = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bajty(D.s), iterations: D.n, hash: 'SHA-256'},
      baza, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    var jawny = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bajty(D.iv)}, klucz, bajty(D.c));
    return new TextDecoder().decode(jawny);
  }
  function pokaz(html){ document.open(); document.write(html); document.close(); }
  async function sprobuj(haslo, cicho){
    var b = document.getElementById('b'), e = document.getElementById('blad');
    b.disabled = true; e.textContent = cicho ? '' : 'Odszyfrowywanie…';
    try {
      var html = await odszyfruj(haslo);
      try { sessionStorage.setItem(KLUCZ_SESJI, haslo); } catch (x) {}
      pokaz(html);
    } catch (x) {
      try { sessionStorage.removeItem(KLUCZ_SESJI); } catch (y) {}
      b.disabled = false;
      e.textContent = cicho ? '' : 'Nieprawidłowe hasło.';
      document.getElementById('haslo').select();
    }
  }
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('blad').textContent = 'Przeglądarka nie obsługuje odszyfrowywania (wymagane HTTPS).';
    document.getElementById('b').disabled = true;
    return;
  }
  document.getElementById('f').addEventListener('submit', function(ev){ ev.preventDefault(); sprobuj(document.getElementById('haslo').value, false); });
  var zapamietane = null;
  try { zapamietane = sessionStorage.getItem(KLUCZ_SESJI); } catch (x) {}
  if (zapamietane) sprobuj(zapamietane, true);
})();
</script>
